name: Bug report
description: Something does not work as described in the documentation.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a problem. Never paste your Ticketmaster API key: the logs of the integration never show it.
  - type: input
    id: gladys-version
    attributes:
      label: Gladys version
      description: Settings → System.
      placeholder: '5.1.1'
    validations:
      required: true
  - type: input
    id: integration-version
    attributes:
      label: Integration version
      description: Integrations → Ticketmaster, or Settings → Supervision.
      placeholder: '0.1.0'
    validations:
      required: true
  - type: input
    id: area
    attributes:
      label: Country, radius and what is followed
      description: 'The country of the house, the radius and categories of "Around the house", the artists and venues concerned (no address needed).'
      placeholder: 'FR, 25 km, music + arts; artist: Muse; venue: Accor Arena'
    validations:
      required: true
  - type: textarea
    id: what-happened
    attributes:
      label: What happened, and what you expected
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: |
        Copy the lines of the Logs tab of the integration around the problem (readings of Ticketmaster, followed artists and venues, calendar sync). Never paste your API key. In developer mode, the environment variable `DEBUG=gladys-integration-sdk` adds the SDK debug logs.
      render: text
